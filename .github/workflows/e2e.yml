name: E2E tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same image as `npm run test:e2e`; layers (apt, npm ci, Electron) cached between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile
          tags: clickered-e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run E2E suites (Xvfb inside the container)
        run: docker run --rm --init --shm-size=512m clickered-e2e
